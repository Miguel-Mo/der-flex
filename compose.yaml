services:
  postgres:
    image: postgres@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_DB: der_flex
      POSTGRES_USER: der_flex
      POSTGRES_PASSWORD: der_flex_local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U der_flex -d der_flex"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  der-flex:
    build: .
    command: ["uvicorn", "der_flex.demo:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2", "--no-access-log"]
    environment:
      DER_FLEX_DATABASE_URL: postgresql://der_flex:der_flex_local@postgres:5432/der_flex
      DER_FLEX_AUTH_MODE: ${DER_FLEX_AUTH_MODE:-development}
      DER_FLEX_WEBHOOK_SECRET: ${DER_FLEX_WEBHOOK_SECRET:-der-flex-local-only-change-me}
      DER_FLEX_MAX_IN_FLIGHT: ${DER_FLEX_MAX_IN_FLIGHT:-64}
      DER_FLEX_PROCESS_OUTBOX_ON_ACTIVATE: "0"
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  outbox-worker:
    build: .
    command: ["der-flex-outbox"]
    environment:
      DER_FLEX_DATABASE_URL: postgresql://der_flex:der_flex_local@postgres:5432/der_flex
      DER_FLEX_WEBHOOK_SECRET: ${DER_FLEX_WEBHOOK_SECRET:-der-flex-local-only-change-me}
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    healthcheck:
      disable: true

volumes:
  postgres-data:
